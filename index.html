<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LogCheck LITE</title>
<style>
body{font-family:Arial; background:#f4f4f4; padding:15px; max-width:400px; margin:auto}
.card{background:#fff; padding:20px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.1)}
h2{text-align:center; margin:0 0 15px}
input{width:100%; padding:12px; margin:6px 0; border-radius:8px; border:1px solid #ccc; box-sizing:border-box}
label{font-weight:bold; font-size:13px; margin-top:10px; display:block}
.btn{width:100%; background:#25D366; color:#fff; padding:14px; border:none; border-radius:10px; font-size:16px; font-weight:bold; margin-top:15px}
.result{background:#eef; padding:10px; border-radius:8px; margin-top:15px; white-space:pre-line; font-size:14px}
</style>
</head>
<body>
<div class="card">
<h2>🚛 LOGCHECK LITE</h2>

<label>Origem:</label>
<input id="origem" placeholder="Ex: Itaúna">

<label>Destino:</label>
<input id="destino" placeholder="Ex: Araxá">

<label>Km Inicial:</label>
<input id="kmIni" type="number" placeholder="Ex: 150500" step="0.001">

<label>Data e Horário Inicial:</label>
<input id="dataIni" type="datetime-local">

<label>Km Final:</label>
<input id="kmFim" type="number" placeholder="Ex: 150900" step="0.001">

<label>Data e Horário Final:</label>
<input id="dataFim" type="datetime-local">

<button class="btn" onclick="gerar()">GERAR FECHAMENTO</button>

<div id="saida" class="result" style="display:none"></div>
<button id="zap" class="btn" style="display:none; background:#128C7E" onclick="enviarZap()">ENVIAR NO WHATSAPP</button>
</div>

<script>
let textoFinal = "";
function formatarData(dataISO){
 if(!dataISO) return "";
 let d = new Date(dataISO);
 let dia = String(d.getDate()).padStart(2,'0');
 let mes = String(d.getMonth()+1).padStart(2,'0');
 let ano = String(d.getFullYear()).slice(-2);
 let h = String(d.getHours()).padStart(2,'0');
 let m = String(d.getMinutes()).padStart(2,'0');
 return `${dia}.${mes}.${ano}. ${h}hs:${m}min`;
}

function gerar(){
 let origem = document.getElementById('origem').value || "Não informado";
 let destino = document.getElementById('destino').value || "Não informado";
 let kmIni = document.getElementById('kmIni').value || "0";
 let kmFim = document.getElementById('kmFim').value || "0";
 let dataIni = formatarData(document.getElementById('dataIni').value);
 let dataFim = formatarData(document.getElementById('dataFim').value);
 
 let kmIniFormat = Number(kmIni).toLocaleString('pt-BR', {minimumFractionDigits:3});
 let kmFimFormat = Number(kmFim).toLocaleString('pt-BR', {minimumFractionDigits:3});

 textoFinal = `🚛 *LOGCHECK - FECHAMENTO*

📍 Origem: ${origem}
📍 Destino: ${destino}
🛣️ Km Inicial: ${kmIniFormat}
⏰ Data e horário: ${dataIni}
🛣️ Km Final: ${kmFimFormat}
⏰ Data e horário: ${dataFim}
📏 Total Rodado: ${(Number(kmFim)-Number(kmIni)).toLocaleString('pt-BR')} km`;

 document.getElementById('saida').style.display='block';
 document.getElementById('saida').innerText = textoFinal;
 document.getElementById('zap').style.display='block';
}

function enviarZap(){
 let url = "https://wa.me/?text=" + encodeURIComponent(textoFinal);
 window.open(url, "_blank");
}
</script>
</body>
</html>
