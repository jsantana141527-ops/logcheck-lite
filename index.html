<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LogCheck LITE - Oficial</title>
<style>
body{font-family:Arial;background:#f4f4f4;padding:15px;max-width:400px;margin:auto}
.card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
h2{text-align:center}
input{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}
label{font-weight:bold;font-size:13px;margin-top:12px;display:block}
.btn{width:100%;background:#25D366;color:#fff;padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:bold;margin-top:15px}
.result{background:#eef;padding:12px;border-radius:8px;margin-top:15px;white-space:pre-line}
</style>
</head>
<body>
<div class="card">
<h2>🚛 LOGCHECK LITE</h2>
<label>Origem:</label><input id="origem">
<label>Destino:</label><input id="destino">
<label>Km Inicial:</label><input id="kmIni" placeholder="150.000">
<label>Data Inicial:</label><input id="dataIni">
<label>Km Final:</label><input id="kmFim" placeholder="150.900">
<label>Data Final:</label><input id="dataFim">
<button class="btn" onclick="gerar()">GERAR FECHAMENTO</button>
<div id="saida" class="result" style="display:none"></div>
<button id="zap" class="btn" style="display:none;background:#128C7E" onclick="enviarZap()">ENVIAR NO WHATSAPP</button>
</div>
<script>
let textoFinal="";
function soNumero(v){
  return parseInt(v.toString().replace(/\D/g,'').replace(/^0+/,'')||'0')||0;
}
function gerar(){
  let origem=document.getElementById('origem').value.trim();
  let destino=document.getElementById('destino').value.trim();
  let kmIniRaw=document.getElementById('kmIni').value.trim();
  let kmFimRaw=document.getElementById('kmFim').value.trim();
  let dataIni=document.getElementById('dataIni').value.trim();
  let dataFim=document.getElementById('dataFim').value.trim();
  let rodado=soNumero(kmFimRaw)-soNumero(kmIniRaw);
  if(rodado<0) rodado=0;
  textoFinal="🚛 *LOGCHECK - FECHAMENTO*\n\n📍 Origem: "+origem+"\n📍 Destino: "+destino+"\n🛣️ Km Inicial: "+kmIniRaw+"\n⏰ Data e horário: "+dataIni+"\n🛣️ Km Final: "+kmFimRaw+"\n⏰ Data e horário: "+dataFim+"\n📏 Total Rodado: "+rodado+" km";
  document.getElementById('saida').style.display='block';
  document.getElementById('saida').innerText=textoFinal;
  document.getElementById('zap').style.display='block';
}
function enviarZap(){
  window.open("https://wa.me/?text="+encodeURIComponent(textoFinal),"_blank");
}
</script>
</body>
</html>
